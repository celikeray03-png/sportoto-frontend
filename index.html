<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spor Toto Takip</title>
<style>
:root{
  --bg:#0f172a; --card:#1a2338; --card2:#212c47; --border:#2c3856;
  --text:#e8ecf7; --muted:#8b96b5; --accent:#22c55e;
  --danger:#ef4444; --warn:#f59e0b; --live:#ef4444;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){ --bg:#f3f5fb; --card:#ffffff; --card2:#f1f3fa; --border:#e1e5f0; --text:#182036; --muted:#6b7590; }
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100%}
.wrap{max-width:820px;margin:0 auto;padding:16px}
.hidden{display:none !important}
h1{font-size:19px;margin:0}
.top{position:sticky;top:0;top:env(safe-area-inset-top,0px);background:var(--bg);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);z-index:5;gap:10px}
.btn{background:var(--accent);color:#04220f;border:none;padding:10px 16px;border-radius:10px;font-weight:700;cursor:pointer;font-size:14px}
.btn:active{opacity:.8}
.btn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--border)}
.btn.small{padding:6px 10px;font-size:12px;border-radius:8px}
input{width:100%;padding:11px;border-radius:10px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:14px;margin-top:6px}
label{font-size:12px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.err{color:var(--danger);font-size:13px;margin-top:8px}
.muted{color:var(--muted);font-size:12px}
.loading{text-align:center;color:var(--muted);padding:20px;font-size:13px}
.coup-title{font-weight:700;font-size:16px;margin-bottom:8px}
.mrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;flex-wrap:wrap}
.mrow:last-child{border-bottom:none}
.mteams{flex:1;min-width:140px;font-weight:600}
.mwhen{font-size:12px;color:var(--muted);min-width:90px;text-align:right}
.mwhen.live{color:var(--live);font-weight:700}
.mwhen.fin{color:var(--text);font-weight:700}
.kolon-wrap{display:flex;gap:5px;flex-wrap:wrap;width:100%;margin-top:2px}
.kolon-chip{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--card2);border:1px solid var(--border);color:var(--muted)}
.kolon-chip.hit{background:#0f3d24;color:var(--accent);border-color:var(--accent)}
.kolon-chip.miss{background:#3d1414;color:var(--danger);border-color:var(--danger)}
.totals{margin-top:10px;font-size:12px;color:var(--muted);border-top:1px dashed var(--border);padding-top:8px}
/* admin editor */
.tblwrap{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;min-width:560px}
th{font-size:11px;color:var(--muted);padding:6px;text-align:center}
td{padding:4px;vertical-align:top}
td input{margin:0 0 4px 0;font-size:13px;padding:8px}
.kbtn{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--card2);color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;margin:1px}
.kbtn.active{background:var(--accent);color:#04220f;border-color:var(--accent)}
.kcell{display:flex;justify-content:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>⚽ Spor Toto Takip</h1>
    <div id="topRight"></div>
  </div>

  <div id="loginCard" class="card hidden" style="margin-top:16px">
    <label>Admin Kullanıcı Adı</label>
    <input id="aUser" placeholder="admin">
    <label>Şifre</label>
    <input id="aPass" type="password" placeholder="••••••">
    <button class="btn" id="aLoginBtn" style="width:100%;margin-top:14px">Giriş Yap</button>
    <div class="err hidden" id="aErr"></div>
  </div>

  <div id="adminPanel" class="hidden">
    <div class="card">
      <label>Kupon Başlığı</label>
      <input id="cTitle" placeholder="Örn: Hafta Sonu Kuponu">
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <label>Kolon Sayısı</label>
        <input id="kolonCountInput" type="number" min="1" max="8" value="3" style="width:70px;margin:0">
      </div>
      <div class="tblwrap"><table id="rowsTable"></table></div>
      <button class="btn small secondary" id="addRow" style="margin-top:10px">+ Maç Ekle</button>
    </div>
    <button class="btn" id="saveCoupon" style="width:100%">Kuponu Kaydet ve Yayınla</button>
    <div class="err hidden" id="createErr"></div>
  </div>

  <div id="publicList"><div class="loading">Kuponlar yükleniyor...</div></div>
</div>

<script>
const API = "https://sportoto-backend.onrender.com";

// EN(ESPN) -> TR isim çevirisi (eşleştirme ve gösterim için)
const TEAM_TR = {
  "England":"İngiltere","Spain":"İspanya","Turkey":"Türkiye","Türkiye":"Türkiye","France":"Fransa","Italy":"İtalya",
  "Sweden":"İsveç","Romania":"Romanya","Belgium":"Belçika","Slovenia":"Slovenya","Scotland":"İskoçya",
  "Bulgaria":"Bulgaristan","Luxembourg":"Lüksemburg","North Macedonia":"Kuzey Makedonya","Switzerland":"İsviçre",
  "Czech Republic":"Çekya","Czechia":"Çekya","Croatia":"Hırvatistan","Lithuania":"Litvanya","Azerbaijan":"Azerbaycan",
  "Austria":"Avusturya","Kosovo":"Kosova","Denmark":"Danimarka","Wales":"Galler","Serbia":"Sırbistan",
  "Netherlands":"Hollanda","Germany":"Almanya","Greece":"Yunanistan","Norway":"Norveç","Portugal":"Portekiz",
  "Poland":"Polonya","Ukraine":"Ukrayna","Russia":"Rusya","Hungary":"Macaristan","Slovakia":"Slovakya",
  "Republic of Ireland":"İrlanda","Ireland":"İrlanda","Northern Ireland":"Kuzey İrlanda","Iceland":"İzlanda",
  "Finland":"Finlandiya","Estonia":"Estonya","Latvia":"Letonya","Belarus":"Belarus","Moldova":"Moldova",
  "Georgia":"Gürcistan","Armenia":"Ermenistan","Israel":"İsrail","Cyprus":"Kıbrıs","Malta":"Malta",
  "Albania":"Arnavutluk","Montenegro":"Karadağ","Bosnia and Herzegovina":"Bosna Hersek","Andorra":"Andorra",
  "San Marino":"San Marino","Gibraltar":"Cebelitarık","Liechtenstein":"Lihtenştayn","Faroe Islands":"Faroe Adaları",
  "Kazakhstan":"Kazakistan","Brazil":"Brezilya","Argentina":"Arjantin","United States":"ABD","Mexico":"Meksika",
  "Japan":"Japonya","South Korea":"Güney Kore","Morocco":"Fas","Egypt":"Mısır","Saudi Arabia":"Suudi Arabistan","Qatar":"Katar"
};
function toTR(name){ return TEAM_TR[name] || name; }

let admin = JSON.parse(localStorage.getItem("st_admin") || "null");
let scoresCache = [];
let couponRows = [];
let kolonCount = 3;

const $ = s => document.querySelector(s);

function newRow(){ return {home:"", away:"", kolon: Array.from({length:kolonCount}, ()=>[])}; }
function ensureOneRow(){ if(couponRows.length===0) couponRows.push(newRow()); }

function renderTopRight(){
  if(admin){
    $("#topRight").innerHTML = `<button class="btn small secondary" id="logoutBtn">Admin Çıkış</button>`;
    $("#logoutBtn").onclick = () => { localStorage.removeItem("st_admin"); admin=null; renderAll(); };
  } else {
    $("#topRight").innerHTML = `<button class="btn small secondary" id="showLoginBtn">Admin Girişi</button>`;
    $("#showLoginBtn").onclick = () => { $("#loginCard").classList.toggle("hidden"); };
  }
}

$("#aLoginBtn").onclick = async () => {
  const username = $("#aUser").value.trim();
  const password = $("#aPass").value.trim();
  const errBox = $("#aErr"); errBox.classList.add("hidden");
  if(!username || !password){ errBox.textContent="Kullanıcı adı ve şifre gerekli."; errBox.classList.remove("hidden"); return; }
  try{
    const res = await fetch(`${API}/api/login`, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({username, password}) });
    const data = await res.json();
    if(data.status !== "success"){ errBox.textContent = data.message || "Giriş başarısız."; errBox.classList.remove("hidden"); return; }
    if(data.user.role !== "admin"){ errBox.textContent = "Bu hesap admin değil."; errBox.classList.remove("hidden"); return; }
    admin = data.user; localStorage.setItem("st_admin", JSON.stringify(admin));
    $("#loginCard").classList.add("hidden");
    renderAll();
  }catch(e){ errBox.textContent="Sunucuya ulaşılamadı. Backend uyanıyor olabilir, biraz bekleyip tekrar dene."; errBox.classList.remove("hidden"); }
};

// ---- Admin: satır editörü ----
function renderRowsTable(){
  const head = `<tr><th style="text-align:left">Maç</th>${
    Array.from({length:kolonCount},(_,k)=>`<th>Kolon ${k+1}</th>`).join("")
  }<th>Sil</th></tr>`;
  const body = couponRows.map((row,ri)=>{
    const kcells = row.kolon.map((sel,ki)=>`<td><div class="kcell">${
      ["1","0","2"].map(v=>`<button type="button" class="kbtn ${sel.includes(v)?'active':''}" data-r="${ri}" data-k="${ki}" data-v="${v}">${v}</button>`).join("")
    }</div></td>`).join("");
    return `<tr>
      <td style="min-width:170px">
        <input class="rhome" data-r="${ri}" placeholder="Ev sahibi" value="${row.home}">
        <input class="raway" data-r="${ri}" placeholder="Deplasman" value="${row.away}">
      </td>
      ${kcells}
      <td style="text-align:center"><button type="button" class="btn small secondary delRow" data-r="${ri}">✕</button></td>
    </tr>`;
  }).join("");
  $("#rowsTable").innerHTML = head + body;
  document.querySelectorAll('.rhome').forEach(i=> i.oninput = ()=> couponRows[i.dataset.r].home = i.value );
  document.querySelectorAll('.raway').forEach(i=> i.oninput = ()=> couponRows[i.dataset.r].away = i.value );
  document.querySelectorAll('.kbtn').forEach(b=> b.onclick = () => {
    const r=b.dataset.r, k=b.dataset.k, v=b.dataset.v;
    const arr = couponRows[r].kolon[k];
    const idx = arr.indexOf(v);
    if(idx>-1) arr.splice(idx,1); else arr.push(v);
    renderRowsTable();
  });
  document.querySelectorAll('.delRow').forEach(b=> b.onclick = () => { couponRows.splice(b.dataset.r,1); renderRowsTable(); });
}
$("#addRow").onclick = () => { couponRows.push(newRow()); renderRowsTable(); };
$("#kolonCountInput").onchange = (e) => {
  kolonCount = Math.max(1, Math.min(8, parseInt(e.target.value)||3));
  couponRows.forEach(row=>{
    while(row.kolon.length<kolonCount) row.kolon.push([]);
    while(row.kolon.length>kolonCount) row.kolon.pop();
  });
  renderRowsTable();
};

$("#saveCoupon").onclick = async () => {
  const errBox = $("#createErr"); errBox.classList.add("hidden");
  const title = $("#cTitle").value.trim() || "Spor Toto Kuponum";
  const valid = couponRows.filter(r=>r.home.trim() && r.away.trim());
  if(valid.length===0){ errBox.textContent="En az bir maçın ev/deplasman adını gir."; errBox.classList.remove("hidden"); return; }
  const matches_data = { matches: valid.map(r=>({home:r.home.trim(), away:r.away.trim(), kolon:r.kolon})) };
  try{
    const r = await fetch(`${API}/api/save-coupon`, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ user_id: admin.id, title, matches_data })});
    const d = await r.json();
    if(d.status!=="success"){ errBox.textContent = d.message||"Kaydedilemedi."; errBox.classList.remove("hidden"); return; }
    couponRows = []; ensureOneRow(); renderRowsTable(); $("#cTitle").value="";
    loadPublicList();
  }catch(e){ errBox.textContent="Kaydedilemedi, tekrar dene."; errBox.classList.remove("hidden"); }
};

// ---- Canlı eşleştirme ----
function findLive(home, away){
  const h=home.trim().toLowerCase(), a=away.trim().toLowerCase();
  return scoresCache.find(s=>{
    const sh=toTR(s.home).toLowerCase(), sa=toTR(s.away).toLowerCase();
    return sh===h && sa===a;
  }) || scoresCache.find(s=> s.home.toLowerCase()===h && s.away.toLowerCase()===a);
}
function resultCode(live){
  if(!live || live.status!=="FINISHED") return null;
  if(live.homeScore>live.awayScore) return "1";
  if(live.homeScore<live.awayScore) return "2";
  return "0";
}
function whenHtml(live){
  if(!live) return '<span class="mwhen">Bilinmiyor</span>';
  if(live.status==="LIVE") return `<span class="mwhen live">🔴 CANLI ${live.homeScore??0}-${live.awayScore??0}</span>`;
  if(live.status==="FINISHED") return `<span class="mwhen fin">${live.homeScore??0}-${live.awayScore??0} (Bitti)</span>`;
  return `<span class="mwhen">${live.matchTime||"--:--"}</span>`;
}

async function loadPublicList(){
  $("#publicList").innerHTML = '<div class="loading">Kuponlar yükleniyor...</div>';
  try{
    const [cr, sr] = await Promise.all([ fetch(`${API}/api/coupons`), fetch(`${API}/api/scores`) ]);
    if(!cr.ok) throw new Error("no-endpoint");
    const cd = await cr.json();
    const sd = await sr.json();
    scoresCache = sd.matches || [];
    const coupons = cd.coupons || [];
    if(coupons.length===0){ $("#publicList").innerHTML='<div class="card muted">Henüz kupon yüklenmedi.</div>'; return; }
    $("#publicList").innerHTML = coupons.map(c=>{
      const raw = c.matches_data;
      const list = Array.isArray(raw) ? raw : (raw.matches||[]);
      const totals = Array.isArray(raw) ? [] : (raw.kolonTotals||[]);
      const rows = list.map(m=>{
        const live = findLive(m.home, m.away);
        const code = resultCode(live);
        const chips = (m.kolon||[]).map((sel,ki)=>{
          let cls="kolon-chip";
          if(code) cls += sel.includes(code) ? " hit" : " miss";
          return `<span class="${cls}">K${ki+1}: ${sel.join(",")||"-"}</span>`;
        }).join("");
        return `<div class="mrow">
          <div class="mteams">${m.home} - ${m.away}</div>
          ${whenHtml(live)}
          <div class="kolon-wrap">${chips}</div>
        </div>`;
      }).join("");
      const totalsHtml = totals.some(t=>t) ? `<div class="totals">Toplam Tutan: ${totals.map((t,i)=>`K${i+1}: ${t||'-'}`).join(" • ")}</div>` : "";
      return `<div class="card"><div class="coup-title">${c.title}</div>${rows}${totalsHtml}</div>`;
    }).join("");
  }catch(e){
    $("#publicList").innerHTML = '<div class="card err">Kuponlar yüklenemedi. Backend uyanıyor olabilir ya da /api/coupons endpoint\'i henüz eklenmemiş olabilir.</div>';
  }
}

function renderAll(){
  renderTopRight();
  $("#adminPanel").classList.toggle("hidden", !admin);
  $("#loginCard").classList.add("hidden");
  if(admin){ ensureOneRow(); renderRowsTable(); }
  loadPublicList();
}
renderAll();
</script>
</body>
</html>
