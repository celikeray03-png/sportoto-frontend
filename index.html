<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spor Toto Canlı Takip</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-2 font-sans antialiased">
  <div class="max-w-md mx-auto space-y-3">
    
    <!-- HEADER -->
    <header class="bg-slate-800 p-3 rounded-xl border border-slate-700 flex justify-between items-center shadow">
      <div>
        <h1 class="font-bold text-sm text-emerald-400">⚽ Spor Toto Canlı Takip</h1>
        <p class="text-[10px] text-slate-400" id="syncTime">Yükleniyor...</p>
      </div>
      <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded text-[10px] font-semibold animate-pulse">Canlı</span>
    </header>

    <!-- KUPON TABLOSU -->
    <div id="content" class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow"></div>

  </div>

  <script>
    const API = "https://sportoto-backend.onrender.com";

    const COUPON_DATA = [
      { id: 1, home: "Türkiye", away: "Fransa", cols: [["2"], ["2"], ["2"]], defaultDate: "25 Eylül", defaultTime: "21:45" },
      { id: 2, home: "Türkiye", away: "İtalya", cols: [["1"], ["1"], ["1"]], defaultDate: "25 Eylül", defaultTime: "21:45" },
      { id: 3, home: "İsveç", away: "Romanya", cols: [["1"], ["1"], ["0"]], defaultDate: "25 Eylül", defaultTime: "19:00" },
      { id: 4, home: "İtalya", away: "Belçika", cols: [["2"], ["0"], ["2"]], defaultDate: "25 Eylül", defaultTime: "21:45" },
      { id: 5, home: "Slovenya", away: "İskoçya", cols: [["2"], ["2"], ["0"]], defaultDate: "25 Eylül", defaultTime: "21:45" },
      { id: 6, home: "Bulgaristan", away: "Lüksemburg", cols: [["1"], ["1"], ["1"]], defaultDate: "26 Eylül", defaultTime: "19:00" },
      { id: 7, home: "Kuzey Makedonya", away: "İsviçre", cols: [["1"], ["2"], ["2"]], defaultDate: "26 Eylül", defaultTime: "21:45" },
      { id: 8, home: "Çekya", away: "Hırvatistan", cols: [["1"], ["2"], ["2"]], defaultDate: "26 Eylül", defaultTime: "21:45" },
      { id: 9, home: "İngiltere", away: "İspanya", cols: [["1"], ["0"], ["2"]], defaultDate: "26 Eylül", defaultTime: "21:45" },
      { id: 10, home: "Litvanya", away: "Azerbaycan", cols: [["1"], ["2"], ["0"]], defaultDate: "27 Eylül", defaultTime: "19:00" },
      { id: 11, home: "Avusturya", away: "Kosova", cols: [["2"], ["1"], ["0"]], defaultDate: "27 Eylül", defaultTime: "21:45" },
      { id: 12, home: "Danimarka", away: "Galler", cols: [["1"], ["1"], ["1"]], defaultDate: "27 Eylül", defaultTime: "21:45" },
      { id: 13, home: "Sırbistan", away: "Hollanda", cols: [["1"], ["2"], ["2"]], defaultDate: "27 Eylül", defaultTime: "21:45" },
      { id: 14, home: "Almanya", away: "Yunanistan", cols: [["1"], ["1"], ["1"]], defaultDate: "28 Eylül", defaultTime: "21:45" },
      { id: 15, home: "Norveç", away: "Portekiz", cols: [["1", "2"], ["1"], ["2"]], defaultDate: "28 Eylül", defaultTime: "21:45" }
    ];

    const TEAM_MAP = {
      "turkey": "turkiye", "turkiye": "turkiye",
      "france": "fransa", "fransa": "fransa",
      "italy": "italya", "italya": "italya",
      "sweden": "isvec", "isvec": "isvec",
      "romania": "romanya", "romanya": "romanya",
      "belgium": "belcika", "belcika": "belcika",
      "slovenia": "slovenya", "slovenya": "slovenya",
      "scotland": "iskocya", "iskocya": "iskocya",
      "bulgaria": "bulgaristan", "bulgaristan": "bulgaristan",
      "luxembourg": "luksemburg", "luksemburg": "luksemburg",
      "north macedonia": "kuzey makedonya", "kuzey makedonya": "kuzey makedonya",
      "switzerland": "isvicre", "isvicre": "isvicre",
      "czechia": "cekya", "czech republic": "cekya", "cekya": "cekya",
      "croatia": "hirvatistan", "hirvatistan": "hirvatistan",
      "england": "ingiltere", "ingiltere": "ingiltere",
      "spain": "ispanya", "ispanya": "ispanya",
      "lithuania": "litvanya", "litvanya": "litvanya",
      "azerbaijan": "azerbaycan", "azerbaycan": "azerbaycan",
      "austria": "avusturya", "avusturya": "avusturya",
      "kosovo": "kosova", "kosova": "kosova",
      "denmark": "danimarka", "danimarka": "danimarka",
      "wales": "galler", "galler": "galler",
      "serbia": "sirbistan", "sirbistan": "sirbistan",
      "netherlands": "hollanda", "hollanda": "hollanda",
      "germany": "almanya", "almanya": "almanya",
      "greece": "yunanistan", "yunanistan": "yunanistan",
      "norway": "norvec", "norvec": "norvec",
      "portugal": "portekiz", "portekiz": "portekiz"
    };

    let cachedScores = JSON.parse(localStorage.getItem('st_cached_scores') || '{}');

    function cleanStr(s) {
      if (!s) return '';
      let lower = s.toLowerCase()
        .replace(/ğ/g, 'g').replace(/ü/g, 'u').replace(/ş/g, 's').replace(/ı/g, 'i').replace(/ö/g, 'o').replace(/ç/g, 'c')
        .replace(/[^a-z0-9\s]/g, '').trim();
      return TEAM_MAP[lower] || lower.replace(/\s+/g, '');
    }

    function renderTable() {
      let totals = [0, 0, 0];

      let html = COUPON_DATA.map((m) => {
        let saved = cachedScores[m.id] || {};
        let hScore = saved.homeScore !== undefined ? saved.homeScore : 0;
        let aScore = saved.awayScore !== undefined ? saved.awayScore : 0;
        let st = saved.status || 'PENDING';
        let mTime = saved.matchTime || m.defaultTime || '--:--';
        let mDate = saved.matchDate || m.defaultDate || '';
        let mMin = saved.matchMinute || 'Canlı';

        let outcome = (st !== 'PENDING') ? (hScore > aScore ? '1' : (hScore < aScore ? '2' : '0')) : null;

        let colCells = [0, 1, 2].map(c => {
          let picks = m.cols[c];
          let correct = outcome && picks.includes(outcome);
          if (correct && st === 'FINISHED') totals[c]++;

          let cls = 'bg-slate-700 text-slate-200';
          if (correct) cls = 'bg-emerald-600 text-white font-bold shadow';
          else if (outcome && st !== 'PENDING') cls = 'bg-red-600/80 text-white';

          return `
            <div class="col-span-2 flex justify-center">
              <span class="px-1.5 py-0.5 rounded text-[10px] ${cls}">${picks.join('')}</span>
            </div>`;
        }).join('');

        let scoreDisplay = `<div class="text-[8px] text-slate-400 leading-tight">${mDate}</div><div class="text-[9px] text-slate-300 font-mono font-bold">${mTime}</div>`;
        if (st === 'LIVE') {
          scoreDisplay = `
            <div class="text-red-500 font-bold animate-pulse text-[10px]">${hScore}-${aScore}</div>
            <div class="text-[8px] text-red-400 font-mono font-bold">${mMin}</div>`;
        } else if (st === 'FINISHED') {
          scoreDisplay = `<span class="font-bold text-slate-200 text-[10px]">${hScore}-${aScore}</span>`;
        }

        return `
          <div class="grid grid-cols-12 py-2 px-2 items-center text-center text-[10px] border-b border-slate-700/50">
            <div class="col-span-5 text-left truncate">
              <div class="font-bold text-slate-200 truncate">${m.home}</div>
              <div class="text-slate-400 truncate">${m.away}</div>
            </div>
            ${colCells}
            <div class="col-span-1 flex flex-col items-center justify-center">${scoreDisplay}</div>
          </div>`;
      }).join('');

      document.getElementById('content').innerHTML = `
        <div class="grid grid-cols-12 text-[9px] font-bold text-slate-400 bg-slate-900/60 py-1.5 px-2 text-center border-b border-slate-700 uppercase">
          <div class="col-span-5 text-left">Maç</div>
          <div class="col-span-2">K1</div>
          <div class="col-span-2">K2</div>
          <div class="col-span-2">K3</div>
          <div class="col-span-1">Durum</div>
        </div>
        <div>${html}</div>
        <div class="p-2.5 bg-slate-900/80 grid grid-cols-12 text-center text-xs font-bold border-t border-slate-700 items-center">
          <div class="col-span-5 text-left text-[10px] text-slate-400">Tutan Maç (15/):</div>
          <div class="col-span-2"><span class="bg-emerald-600 text-white px-2 py-0.5 rounded text-[10px]">${totals[0]}</span></div>
          <div class="col-span-2"><span class="bg-emerald-600 text-white px-2 py-0.5 rounded text-[10px]">${totals[1]}</span></div>
          <div class="col-span-2"><span class="bg-emerald-600 text-white px-2 py-0.5 rounded text-[10px]">${totals[2]}</span></div>
          <div class="col-span-1"></div>
        </div>
      `;
    }

    async function fetchScores() {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 12000); // 12 saniye yeterli süre

        const res = await fetch(API + '/api/scores', { signal: controller.signal });
        clearTimeout(timeoutId);
        
        const data = await res.json();
        const scores = data.matches || [];

        if (scores.length === 0) return;

        let hasUpdates = false;

        // Performans Optimizasyonu: API maçlarını önceden normalize edip haritalıyoruz
        const mappedScores = scores.map(s => ({
          ...s,
          cleanHome: cleanStr(s.home),
          cleanAway: cleanStr(s.away)
        }));

        COUPON_DATA.forEach(m => {
          if (cachedScores[m.id] && cachedScores[m.id].status === 'FINISHED') return;

          let normHome = cleanStr(m.home);
          let normAway = cleanStr(m.away);

          let lm = mappedScores.find(s => 
            (s.cleanHome.includes(normHome) || normHome.includes(s.cleanHome)) &&
            (s.cleanAway.includes(normAway) || normAway.includes(s.cleanAway))
          );

          if (lm) {
            cachedScores[m.id] = {
              homeScore: lm.homeScore,
              awayScore: lm.awayScore,
              status: lm.status,
              matchTime: lm.matchTime,
              matchDate: lm.matchDate,
              matchMinute: lm.matchMinute
            };
            hasUpdates = true;
          }
        });

        if (hasUpdates) {
          localStorage.setItem('st_cached_scores', JSON.stringify(cachedScores));
          renderTable();
        }

        document.getElementById('syncTime').innerText = 'Son Güncelleme: ' + new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });

      } catch (e) {
        document.getElementById('syncTime').innerText = 'Sunucu bekleniyor...';
        setTimeout(fetchScores, 5000);
      }
    }
    
    window.onload = () => {
      renderTable();
      fetchScores();
      setInterval(fetchScores, 30000);
    };
  </script>
</body>
</html>
